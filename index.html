<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awesome Password Generator</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Awesome Password Generator</h1>
            <div class="theme-toggle">
                <input type="checkbox" id="theme-switch" aria-label="Toggle Dark and Light Theme" title="Toggle theme">
                <label for="theme-switch" class="toggle-label">
                    <i class="fas fa-sun"></i>
                    <i class="fas fa-moon"></i>
                </label>
            </div>
        </header>

        <main>
            <div class="password-display">
                <div id="password-output" class="password-text" aria-live="polite" aria-label="Generated password text"></div>
                <div class="password-actions">
                    <button id="copy-btn" class="btn" title="Copy to clipboard" aria-label="Copy password to clipboard">
                        <i class="fas fa-copy"></i>
                    </button>
                    <button id="refresh-btn" class="btn" title="Generate new password" aria-label="Generate new password">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>

            <div class="strength-meter">
                <div class="strength-label">Password Strength: <span id="strength-text">None</span></div>
                <div class="meter-container">
                    <div id="strength-meter" class="meter"></div>
                </div>
                <div class="entropy-display">Entropy: <span id="entropy-value">0</span> bits</div>
            </div>

            <div class="options-container">
                <div class="option-group">
                    <label for="length-slider">Password Length: <span id="length-value">16</span></label>
                    <div class="slider-container">
                        <input type="range" id="length-slider" min="8" max="128" value="16" class="slider">
                    </div>
                </div>

                <div class="character-options">
                    <div class="option">
                        <input type="checkbox" id="uppercase" checked>
                        <label for="uppercase">Uppercase (A-Z)</label>
                    </div>
                    <div class="option">
                        <input type="checkbox" id="lowercase" checked>
                        <label for="lowercase">Lowercase (a-z)</label>
                    </div>
                    <div class="option">
                        <input type="checkbox" id="numbers" checked>
                        <label for="numbers">Numbers (0-9)</label>
                    </div>
                    <div class="option">
                        <input type="checkbox" id="symbols" checked>
                        <label for="symbols">Symbols (!@#$%^&*)</label>
                    </div>
                </div>

                <div class="advanced-options">
                    <div class="option">
                        <input type="checkbox" id="exclude-similar">
                        <label for="exclude-similar">Exclude Similar Characters (0/O, 1/l/I)</label>
                    </div>
                    <div class="option">
                        <input type="checkbox" id="pronounceable">
                        <label for="pronounceable">Pronounceable Password</label>
                    </div>
                    <div class="custom-exclude">
                        <label for="exclude-chars">Custom Exclusions:</label>
                        <input type="text" id="exclude-chars" placeholder="Characters to exclude">
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button id="generate-btn" class="primary-btn">Generate Password</button>
                <button id="save-template-btn" class="secondary-btn">Save Template</button>
                <button id="load-template-btn" class="secondary-btn">Load Template</button>
            </div>

            <div class="password-history">
                <div class="history-header">
                    <h3>Password History</h3>
                    <div class="history-controls">
                        <button id="mask-history-btn" class="secondary-btn btn-sm" aria-label="Toggle password masking">
                            <i class="fas fa-eye-slash"></i> Mask
                        </button>
                        <button id="clear-history-btn" class="secondary-btn btn-sm" aria-label="Clear password history">
                            <i class="fas fa-trash"></i> Clear
                        </button>
                    </div>
                </div>
                <div id="history-list" class="history-list"></div>
            </div>
        </main>

        <div id="templates-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-content">
                <span class="close-modal" aria-label="Close modal" tabindex="0">&times;</span>
                <h2 id="modal-title">Saved Templates</h2>
                <div id="templates-list" class="templates-list"></div>
            </div>
        </div>

        <div id="animation-container" class="animation-container"></div>
        
        <div id="typewriter-widget" class="typewriter-wrapper" aria-hidden="true">
            <div class="typewriter">
                <div class="slide"><i></i></div>
                <div class="paper"></div>
                <div class="keyboard"></div>
            </div>
        </div>
    </div>

    <script src="js/animations.js"></script>
    <script src="js/password-generator.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
